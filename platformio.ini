[platformio]
default_envs = t-display-s3-amoled-plus
boards_dir = boards

; LilyGo T-Display-S3 AMOLED Plus (1.91" 240x536 RM67162, touch CST816T, PMU BQ25896).
; lvgl / SensorLib / XPowersLib come bundled with the LilyGo-AMOLED-Series repo
; checked out in ../../Lilygo (same setup as ../../Lilygo/ble-mouse);
; lv_conf.h lives in lib/LilyGo-AMOLED-Series/src (hence LV_CONF_INCLUDE_SIMPLE).
[env:t-display-s3-amoled-plus]
platform = espressif32@6.7.0
framework = arduino
board = T-Display-AMOLED
upload_speed = 921600
; Over USB-Serial-JTAG the RTS hard reset leaves the chip in the ROM
; bootloader (black screen until reset); a watchdog reset boots the firmware.
; Bundled esptool 4.5.1 lacks it - use pioarduino's esptool (as ble-mouse's
; waveshare env does).
board_upload.after_reset = watchdog_reset
platform_packages =
    tool-esptoolpy @ https://github.com/pioarduino/esptool/releases/download/v4.8.9/esptool.zip
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder
; `pio run -t ota`: upload over Bluetooth to the paired adapter (Windows)
extra_scripts = post:tools/pio_ota.py
lib_extra_dirs =
    ${PROJECT_DIR}/../../Lilygo/LilyGo-AMOLED-Series/libdeps
build_flags =
    -DBOARD_HAS_PSRAM
    -DDISABLE_ALL_LIBRARY_WARNINGS
    ; Serial = UART0 (GPIO43/44, CN1 JST-SH): in BT mode the native USB is the
    ; USB host port, so the console cannot live on USB CDC. Logs are also mirrored
    ; to the native USB CDC (USBSerial) until the USB host takes the PHY.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
